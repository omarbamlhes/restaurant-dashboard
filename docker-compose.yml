# Local dev services. Ports match .env.example / apps/api/.env (5432, 6379),
# so `docker compose up` gives the exact environment the API expects.
# Note: run EITHER these containers OR a native Postgres/Redis — not both, since
# they'd bind the same host ports.
services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
